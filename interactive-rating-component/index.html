<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Interactive Rating Component</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <!-- =========================
             Rating Card
        ========================== -->

        <section class="card rating-card" id="rating-card">

            <div class="star-box">
                <img src="icon-star.svg" alt="Star Icon">
            </div>

            <h1>How did we do?</h1>

            <p class="description">
                Please let us know how we did with your support
                request. All feedback is appreciated to help us
                improve our offering!
            </p>

            <div class="rating-buttons">

                <button class="rating-btn" data-value="1">
                    1
                </button>

                <button class="rating-btn" data-value="2">
                    2
                </button>

                <button class="rating-btn" data-value="3">
                    3
                </button>

                <button class="rating-btn" data-value="4">
                    4
                </button>

                <button class="rating-btn" data-value="5">
                    5
                </button>

            </div>

            <button id="submit-btn" class="submit-btn">
                SUBMIT
            </button>

        </section>


        <!-- =========================
             Thank You Card
        ========================== -->

        <section
            class="card thank-you-card hidden"
            id="thank-you-card"
        >

            <img
                src="illustration-thank-you.svg"
                alt="Thank You Illustration"
                class="thank-you-image"
            >

            <div class="selected-rating">
                You selected
                <span id="selected-rating">4</span>
                out of 5
            </div>

            <h2>Thank you!</h2>

            <p class="thank-you-text">
                We appreciate you taking the time to give a
                rating. If you ever need more support,
                don't hesitate to get in touch!
            </p>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
