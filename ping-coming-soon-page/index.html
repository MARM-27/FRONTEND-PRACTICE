<!DOCTYPE html>
<html>
    <head>
        <title>Ping Coming Soon</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <script src="https://kit.fontawesome.com/9c216976e2.js" crossorigin="anonymous"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <section>
            <header>
                <img src="logo.svg">
            </header>
            <main>
                <div class="main-title">
                    <h1>We are launching <span>soon!</span></h1>
                    <p>Subscribe to get notified</p>
                </div>
                <div class="input">
                    <form novalidate>
                        <!-- Wrap the input and error message together -->
                        <div class="input-wrapper">
                            <input type="email" id="email" placeholder="Your email address..." required>
                            <p class="error-msg">Please provide a valid email address</p>
                        </div>
    
                        <button type="submit">Notify Me</button>
                    </form>
                </div>
                <div class="illustration">
                    <img src="illustration-dashboard.png">
                </div>
            </main>
            <footer>
                <div class="social-icons"></div>
                    <a href="https://www.facebook.com" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="https://www.twitter.com" target="_blank"><i class="fa-brands fa-twitter"></i></a>
                    <a href="https://www.instagram.com" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                </div>
                <p>&copy Copyright Ping. All rights reserved.</p>
            </footer>
        </body>
    </section>
    <script src="script.js"></script>
</html>
